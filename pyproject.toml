[project]
name = "credit-scoring"
version = "0.1.0"
description = "Reproducible GiveMeSomeCredit EDA, modeling, and scorecard pipeline"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "joblib==1.5.3",
    "kaggle==2.2.4",
    "lightgbm==4.7.0",
    "matplotlib==3.11.1",
    "nbformat==5.10.4",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "scikit-learn==1.9.0",
    "seaborn==0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_scoring"]
